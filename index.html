<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ezber</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="container">

        <h1>Ezber</h1>
        <p class="subtitle">Learn. Practice. Remember.</p>

        <section id="home">
            <h2>Choose a set</h2>

            <button onclick="startQuiz()">
                English Vocabulary
            </button>
        </section>

        <section id="quiz" class="hidden">
            <p id="progress"></p>

            <h2 id="question"></h2>

            <input
                type="text"
                id="answer"
                placeholder="Type your answer..."
                autocomplete="off"
            >

            <button onclick="checkAnswer()">Check</button>

            <p id="result"></p>
        </section>

        <section id="finished" class="hidden">
            <h2>Finished!</h2>
            <p id="score"></p>

            <button onclick="location.reload()">
                Try again
            </button>
        </section>

    </main>

    <script src="script.js"></script>
</body>
</html>
